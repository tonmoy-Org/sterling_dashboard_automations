version: '3.8'

services:
  dispatch-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatch_automation
    restart: always
    ports:
      - "8080:3000"
    env_file:
      - dispatch/.env
    environment:
      - HEADLESS=true
      - PORT=3000
      - TZ=America/Los_Angeles
    volumes:
      - ./dispatch/config:/app/config
      - ./dispatch/assets:/app/assets
      - ./dispatch/run_standalone.py:/app/run_standalone.py
      - ./dispatch/dispatch_board_display_automation_scraper.py:/app/dispatch_board_display_automation_scraper.py
      - ./dispatch/base_scraper.py:/app/base_scraper.py
    command: python run_standalone.py --live --days 31 --loop --port 3000
